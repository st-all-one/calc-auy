[package]
name = "calc-auy-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Núcleo do CalcAUY: racionais híbridos, AST, engine, integridade"

[features]
default = []
# Instrumentação transversal. OFF por defeito: custo literalmente zero.
instrument = []
# Determinismo em testes: instala MockClock
deterministic = []
# Paralelismo de lotes e redução intra-operação (rayon).
parallel = ["dep:rayon"]

[dependencies]
calc-auy-macros = { path = "../calc-auy-macros" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
num-integer.workspace = true
blake3.workspace = true
hex.workspace = true
base64.workspace = true
bs58.workspace = true
data-encoding.workspace = true
secrecy.workspace = true
zeroize.workspace = true
tracing = "0.1"
smallvec.workspace = true
uuid = { version = "1", features = ["v7", "serde", "js"] }
rayon = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
trybuild.workspace = true

[[bench]]
name = "rational"
harness = false

[[bench]]
name = "ast"
harness = false

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "batch"
harness = false

[lints]
workspace = true
