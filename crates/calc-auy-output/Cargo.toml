[package]
name = "calc-auy-output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Formatadores de saída: monetary, latex, unicode, audit, mermaid"

[dependencies]
calc-auy-core = { path = "../calc-auy-core" }
calc-auy-nlg = { path = "../calc-auy-nlg" }
calc-auy-render = { path = "../calc-auy-render", optional = true }
num-bigint.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# Representações visuais (HTML/KaTeX, SVG e PNG). Desligada por padrão para
# manter o caminho de formatação textual leve; ligue com `features = ["render"]`.
render = ["dep:calc-auy-render"]

[dev-dependencies]
proptest.workspace = true
calc-auy-parser = { path = "../calc-auy-parser" }
calc-auy-i18n = { path = "../calc-auy-i18n" }

[lints]
workspace = true
