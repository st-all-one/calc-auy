[package]
name = "calc-auy-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Renderização visual: KaTeX (HTML) e LaTeX → SVG/PNG"

[dependencies]
calc-auy-core = { path = "../calc-auy-core" }
katex-rs = "0.3"
latex-rust = { version = "2.1", default-features = false, features = ["std"] }
thiserror.workspace = true

[features]
default = ["png"]
# Rasterização PNG (traz `tiny-skia`). Desligue para builds só-SVG.
png = ["latex-rust/png"]
# Instrumentação transversal (spans/eventos estruturados do `diag`).
instrument = ["calc-auy-core/instrument"]

[lints]
workspace = true
